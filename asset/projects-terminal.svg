<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="528" viewBox="0 0 1200 528" role="img" aria-label="Animated four-project terminal repository showcase">
  <title>Animated four-project terminal repository showcase</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071020"/><stop offset=".55" stop-color="#0b1830"/><stop offset="1" stop-color="#070b1c"/></linearGradient>
    <linearGradient id="bright" x1="0" x2="1"><stop stop-color="#49eadb"/><stop offset=".55" stop-color="#67a6ff"/><stop offset="1" stop-color="#b488ff"/></linearGradient>
    <linearGradient id="tealblue" x1="0" x2="1"><stop stop-color="#54ffe0"/><stop offset="1" stop-color="#79baff"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#00e4dc" stop-opacity=".22"/><stop offset="1" stop-color="#00c6e8" stop-opacity="0"/></radialGradient>
    <radialGradient id="purplehalo"><stop stop-color="#8155d9" stop-opacity=".20"/><stop offset="1" stop-color="#8155d9" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#79b5d9" stroke-width=".6" stroke-opacity=".095"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="frame"><rect width="1200" height="528" rx="17"/></clipPath>
    <style>
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .sans{font-family:Inter,'Segoe UI',Arial,sans-serif}
      .pulse{animation:pulse 3.4s ease-in-out infinite}
      .pulseB{animation:pulse 3.4s ease-in-out 1.1s infinite}
      .blink{animation:blink 1.08s steps(2,start) infinite}
      .orbit{transform-origin:910px 219px;animation:orbit 32s linear infinite}
      .orbitRev{transform-origin:910px 219px;animation:orbit 39s linear infinite reverse}
      .dash{stroke-dasharray:7 17;animation:travel 3.2s linear infinite}
      .flowSlow{stroke-dasharray:8 15;animation:travel 7s linear infinite}
      .float{animation:float 5s ease-in-out infinite}
      .floatB{animation:float 5s ease-in-out 1.6s infinite}
      .arrive{animation:arrive 1.15s ease-out both}
      .arriveB{animation:arrive 1.2s ease-out .4s both}
      .arriveC{animation:arrive 1.2s ease-out .8s both}
      .sweep{animation:sweep 9s ease-in-out infinite}
      .sweepShort{animation:sweepSmall 6s ease-in-out infinite}
      .rail{animation:travel 4s linear infinite;stroke-dasharray:4 19}
      .bar{animation:bar 4.2s ease-in-out infinite}
      .focus{animation:focus 8s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.95}50%{opacity:.3}}
      @keyframes blink{50%{opacity:0}}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @keyframes travel{to{stroke-dashoffset:-240}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes arrive{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:translateY(0)}}
      @keyframes sweep{0%,8%{transform:translateX(-700px);opacity:0}27%{opacity:.7}56%{opacity:.65}86%,100%{transform:translateX(1400px);opacity:0}}
      @keyframes sweepSmall{0%{transform:translateX(-500px);opacity:0}50%{opacity:.7}100%{transform:translateX(1250px);opacity:0}}
      @keyframes bar{0%,100%{opacity:.35}50%{opacity:.95}}
      @keyframes focus{0%,100%{opacity:.28}50%{opacity:.8}}
      @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="528" fill="url(#base)"/>
    <rect width="1200" height="528" fill="url(#grid)"/>
    <rect x="1" y="1" width="1198" height="526" rx="16" fill="none" stroke="#315572" stroke-width="1" />
    <g opacity=".8"><path d="M24 21L72 21" fill="none" stroke="#55ffe1" stroke-width="2" /><path d="M1128 506L1176 506" fill="none" stroke="#55ffe1" stroke-width="2" /><path d="M24 506L24 482" fill="none" stroke="#55ffe1" stroke-width="2" /><path d="M1176 21L1176 45" fill="none" stroke="#55ffe1" stroke-width="2" /></g>
  <rect x="22" y="20" width="1156" height="39" rx="8" fill="#0a182b" stroke="#23445d" stroke-width="1" /><circle cx="43" cy="39" r="4.5" fill="#ff6d7d" /><circle cx="63" cy="39" r="4.5" fill="#ffd16b" /><circle cx="83" cy="39" r="4.5" fill="#65f0da" /><text x="113" y="45" font-family="monospace" font-size="12" font-weight="600" fill="#c5dfeb" letter-spacing="1.2">~/workspaces/projects · git log --graph</text><text x="1155" y="45" font-family="monospace" font-size="11" font-weight="500" fill="#8da8c2" text-anchor="end" letter-spacing=".6">PUBLIC REPOSITORIES // PORTFOLIO</text><text x="49" y="110" font-family="monospace" font-size="22" font-weight="650" fill="#55ffe1" >❯ ls -la ~/projects/</text><text x="49" y="148" font-family="sans-serif" font-size="27" font-weight="720" fill="#f3f9ff" >SELECTED WORK / EXPLORATION LOG</text><rect x="50" y="176" width="540" height="145" rx="12" fill="#0b1b30" stroke="#294f6c" stroke-width="1" /><circle cx="72" cy="199" r="5" fill="#55ffe1" class="pulse"/><text x="86" y="205" font-family="sans-serif" font-size="19" font-weight="760" fill="#f3f9ff" >01 / DEV PILOT AI</text><text x="572" y="204" font-family="monospace" font-size="11" font-weight="500" fill="#55ffe1" text-anchor="end">AI / SOFTWARE ENGINEERING</text><path d="M70 222L570 222" fill="none" stroke="#315571" stroke-width="1" /><text x="71" y="250" font-family="monospace" font-size="13" font-weight="450" fill="#55ffe1" >$ stack: FastAPI · Next.js · PostgreSQL</text><text x="71" y="277" font-family="sans-serif" font-size="14" font-weight="450" fill="#c7dce9" >Multi-agent and document intelligence</text><text x="71" y="300" font-family="monospace" font-size="13" font-weight="450" fill="#8aa9c3" >Design focus: RAG &amp; service boundaries</text><rect x="608" y="176" width="540" height="145" rx="12" fill="#0b1b30" stroke="#294f6c" stroke-width="1" /><circle cx="630" cy="199" r="5" fill="#76b8ff" class="pulse"/><text x="644" y="205" font-family="sans-serif" font-size="19" font-weight="760" fill="#f3f9ff" >02 / MAROC AFFILIATE AI</text><text x="1130" y="204" font-family="monospace" font-size="11" font-weight="500" fill="#76b8ff" text-anchor="end">TRUSTED BACKEND</text><path d="M628 222L1128 222" fill="none" stroke="#315571" stroke-width="1" /><text x="629" y="250" font-family="monospace" font-size="13" font-weight="450" fill="#76b8ff" >$ stack: Python · FastAPI · PostgreSQL</text><text x="629" y="277" font-family="sans-serif" font-size="14" font-weight="450" fill="#c7dce9" >AI-assisted marketing workflows</text><text x="629" y="300" font-family="monospace" font-size="13" font-weight="450" fill="#8aa9c3" >Design focus: validations &amp; approvals</text><rect x="50" y="336" width="540" height="145" rx="12" fill="#0b1b30" stroke="#294f6c" stroke-width="1" /><circle cx="72" cy="359" r="5" fill="#b391ff" class="pulse"/><text x="86" y="365" font-family="sans-serif" font-size="19" font-weight="760" fill="#f3f9ff" >03 / MINI RAG PRO</text><text x="572" y="364" font-family="monospace" font-size="11" font-weight="500" fill="#b391ff" text-anchor="end">RETRIEVAL EXPERIMENTS</text><path d="M70 382L570 382" fill="none" stroke="#315571" stroke-width="1" /><text x="71" y="410" font-family="monospace" font-size="13" font-weight="450" fill="#b391ff" >$ stack: Python · LLMs · Vector retrieval</text><text x="71" y="437" font-family="sans-serif" font-size="14" font-weight="450" fill="#c7dce9" >RAG concepts and retrieval experiments</text><text x="71" y="460" font-family="monospace" font-size="13" font-weight="450" fill="#8aa9c3" >Design focus: grounded answers</text><rect x="608" y="336" width="540" height="145" rx="12" fill="#0b1b30" stroke="#294f6c" stroke-width="1" /><circle cx="630" cy="359" r="5" fill="#55ffe1" class="pulse"/><text x="644" y="365" font-family="sans-serif" font-size="19" font-weight="760" fill="#f3f9ff" >04 / TERMINAL PORTFOLIO</text><text x="1130" y="364" font-family="monospace" font-size="11" font-weight="500" fill="#55ffe1" text-anchor="end">INTERFACE EXPERIMENT</text><path d="M628 382L1128 382" fill="none" stroke="#315571" stroke-width="1" /><text x="629" y="410" font-family="monospace" font-size="13" font-weight="450" fill="#55ffe1" >$ stack: Next.js · TypeScript · React</text><text x="629" y="437" font-family="sans-serif" font-size="14" font-weight="450" fill="#c7dce9" >Developer identity as an interface</text><text x="629" y="460" font-family="monospace" font-size="13" font-weight="450" fill="#8aa9c3" >Design focus: interaction design</text><text x="52" y="513" font-family="monospace" font-size="11" font-weight="400" fill="#839bb9" >NOTE: PROJECT DESCRIPTIONS DESCRIBE DIRECTION AND PUBLIC WORK; CHECK EACH REPOSITORY FOR CURRENT IMPLEMENTATION.</text></g></svg>