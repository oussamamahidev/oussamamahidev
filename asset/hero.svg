 stroke-width="1" class="blink"/><text x="64" y="405" font-family="monospace" font-size="14" font-weight="500" fill="#8da8c2" >BUILDING RELIABLE SYSTEMS. EXPLORING INTELLIGENT ONES.</text><text x="64" y="429" font-family="monospace" font-size="11" font-weight="500" fill="#5f8dac" >RABAT, MOROCCO     •     ENGINEERING PROFILE / 2026</text><circle cx="920" cy="229" r="204" fill="url(#halo)" /><circle cx="920" cy="229" r="160" fill="none" stroke="#6aa6c6" stroke-opacity="0.24" stroke-width="1" stroke-dasharray="5 12"/><circle cx="920" cy="229" r="125" fill="none" stroke="#6aa6c6" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="0 12"/><circle cx="920" cy="229" r="91" fill="none" stroke="#6aa6c6" stroke-opacity="0.38" stroke-width="1" stroke-dasharray="5 12"/><g class="orbit"><circle cx="920" cy="229" r="157" fill="none" stroke="#67f7e1" stroke-width="3" stroke-dasharray="68 930"/><circle cx="1077" cy="229" r="6" fill="#55ffe1"/><circle cx="1077" cy="229" r="16" fill="#55ffe1" opacity=".12"/></g><g class="orbitRev"><circle cx="920" cy="229" r="125" fill="none" stroke="#b391ff" stroke-width="3" stroke-dasharray="42 780"/><circle cx="795" cy="229" r="5" fill="#b391ff"/></g><circle cx="920" cy="229" r="74" fill="#0e2540" stroke="#467d9c" stroke-width="1.3"/><circle cx="920" cy="229" r="62" fill="none" stroke="#76ffea" stroke-opacity=".7" stroke-dasharray="3 8" class="pulse"/><path d="M905 211l-17 18 17 18 M934 211l17 18-17 18 M928 204l-15 50" stroke="#55ffe1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="920" y="280" font-family="monospace" font-size="11" font-weight="550" fill="#84b9d1" text-anchor="middle" letter-spacing="1">SYSTEM / ONLINE</text><rect x="728" y="101" width="117" height="31" rx="7" fill="#0b1b32" stroke="#76b8ff" stroke-width="1" /><circle cx="741" cy="117" r="3" fill="#76b8ff" /><text x="754" y="122" font-family="monospace" font-size="12" font-weight="650" fill="#f3f9ff" >BACKEND</text><rect x="1010" y="11