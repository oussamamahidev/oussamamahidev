<style>.sans{font-family:Inter,'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Liberation Mono',monospace}.orbit{transform-origin:930px 230px;animation:turn 26s linear infinite}.orbit2{transform-origin:930px 230px;animation:turn 38s linear infinite reverse}.breathe{animation:glow 6s ease-in-out infinite}.dash{stroke-dasharray:7 15;animation:dash 8s linear infinite}.fade{animation:enter 1.15s ease-out both}.blink{animation:blink 1.2s steps(1) infinite}@keyframes turn{to{transform:rotate(360deg)}}@keyframes glow{50%{opacity:.5}}@keyframes dash{to{stroke-dashoffset:-110}}@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.orbit,.orbit2,.breathe,.dash,.fade,.blink{animation:none}}</style>
