<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-label="Animated systems architecture: input to API to asynchronous processing to data to intelligent output">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1022"/><stop offset="1" stop-color="#12172C"/></linearGradient><linearGradient id="path" x2="1"><stop stop-color="#63E4D6"/><stop offset=".5" stop-color="#89A5FF"/><stop offset="1" stop-color="#C18EFF"/></linearGradient></defs>
<style>.sans{font-family:Inter,'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Liberation Mono',monospace}.flow{stroke-dasharray:8 18;animation:run 2.2s linear infinite}.dot{animation:pulse 2.6s ease-in-out infinite}.dot2{animation:pulse 2.6s ease-in-out infinite .9s}@keyframes run{to{stroke-dashoffset:-104}}@keyframes pulse{50%{opacity:.22}}@media(prefers-reduced-motion:reduce){.flow,.dot,.dot2{animation:none}}</style>
<rect width="1200" height="290" rx="18" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="288" rx="17" fill="none" stroke="#8193BD" stroke-opacity=".32"/><text x="43" y="47" class="mono" font-size="13" letter-spacing="2" fill="#83A2D0">DESIGNING FOR RELIABILITY</text><text x="1157" y="47" class="mono" font-size="12" fill="#80ECDD" text-anchor="end">SYSTEMS / WORKFLOW</text>
<path d="M169 150H1031" stroke="#4D617E" stroke-width="2"/><path d="M169 150H1031" stroke="url(#path)" stroke-width="3" class="flow" fill="none"/>
<g class="sans" text-anchor="middle" font-size="17" font-weight="600"><g><rect x="45" y="103" width="210" height="96" rx="13" fill="#16243C" stroke="#4EAFA7" stroke-opacity=".6"/><circle cx="68" cy="124" r="5" fill="#6BEADB" class="dot"/><text x="150" y="147" fill="#EFF8FF">Signals</text><text x="150" y="173" font-size="12" font-weight="400" fill="#97AECF">Events · Requests</text></g><g><rect x="345" y="103" width="210" height="96" rx="13" fill="#17223C" stroke="#7189DE" stroke-opacity=".6"/><circle cx="368" cy="124" r="5" fill="#8AABFF" class="dot2"/><text x="450" y="147" fill="#EFF8FF">Services</text><text x="450" y="173" font-size="12" font-weight="400" fill="#97AECF">APIs · Boundaries</text></g><g><rect x="645" y="103" width="210" height="96" rx="13" fill="#1B2240" stroke="#9D7CD9" stroke-opacity=".6"/><circle cx="668" cy="124" r="5" fill="#C193FF" class="dot"/><text x="750" y="147" fill="#EFF8FF">Knowledge</text><text x="750" y="173" font-size="12" font-weight="400" fill="#97AECF">Data · Retrieval</text></g><g><rect x="945" y="103" width="210" height="96" rx="13" fill="#17283F" stroke="#60BDAE" stroke-opacity=".6"/><circle cx="968" cy="124" r="5" fill="#63E4D6" class="dot2"/><text x="1050" y="147" fill="#EFF8FF">Decisions</text><text x="1050" y="173" font-size="12" font-weight="400" fill="#97AECF">Controls · Feedback</text></g></g><text x="600" y="250" class="mono" font-size="13" fill="#879EC1" text-anchor="middle">CORRECTNESS  /  OBSERVABILITY  /  SECURITY  /  RECOVERY</text></svg>